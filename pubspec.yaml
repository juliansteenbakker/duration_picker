name: duration_picker
description: A time picker widget that can select both minutes and hours. Fork from flutter_duration_picker.
version: 1.3.0
homepage: https://github.com/juliansteenbakker/duration_picker

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  lint: ^2.0.0

screenshots:
  - description: An inline duration picker set to 1 hour 25 minutes.
    path: doc/screenshots/inline.png
  - description: The duration picker dialog with a title.
    path: doc/screenshots/dialog.png
