name: Bug report
description: Report a problem with duration_picker
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues (open and closed) before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: input
    attributes:
      label: duration_picker version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    attributes:
      label: Flutter doctor output
      description: Output of `flutter doctor -v`.
      render: text

  - type: textarea
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce the behavior. A minimal reproducible sample project or code snippet is very helpful.
    validations:
      required: true

  - type: textarea
    attributes:
      label: How do you show the picker?
      description: |
        The `DurationPicker` widget or `showDurationPicker` call, including the parameters you pass (base unit, bounds, decoration).
      render: dart

  - type: textarea
    attributes:
      label: Screenshots or logs
      description: A screenshot or recording helps a lot for visual issues. Add relevant logs or stack traces too.
